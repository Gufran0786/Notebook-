name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          
          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java Version Output: $JAVA_VER_OUTPUT"
          
          MAJOR_VERSION=$(echo "$JAVA_VER_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          
          if [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Active Java Major Version: $MAJOR_VERSION"
            if [ "$MAJOR_VERSION" -lt 17 ]; then
              echo "::error::Java version $MAJOR_VERSION is lower than required version 17."
              exit 1
            fi
            echo "Java version check passed ($MAJOR_VERSION >= 17)."
          else
            echo "::error::Could not detect Java major version from '$JAVA_VER_OUTPUT'."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore confirmed present."
          else
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK"
            echo "Searching inside app/build/outputs/apk directory:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK is empty."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) echo "APK extension valid." ;;
            *) echo "::error::$EXPECTED_APK does not have .apk extension." && exit 1 ;;
          esac
          
          APK_SIZE=$(stat -c%s "$EXPECTED_APK")
          echo "Debug APK verified successfully: $EXPECTED_APK (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME=$(echo "$RAW_REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          ASSET_NAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/github_release_asset"
          mkdir -p "$TEMP_RELEASE_DIR"
          
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="${TEMP_RELEASE_DIR}/${ASSET_NAME}"
          
          cp "$ORIGINAL_APK" "$DEST_APK"
          
          if [ ! -s "$DEST_APK" ]; then
            echo "::error::Failed to prepare release asset at $DEST_APK"
            exit 1
          fi
          
          echo "Release asset prepared: $DEST_APK"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset $ASSET_PATH is missing or empty."
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          
          NOTES=$(cat <<EOF
          ### 📱 Debug APK Build #${GITHUB_RUN_NUMBER}
          
          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit**: ${GITHUB_SHA}
          - **Target**: Testing and verification
          - **Note**: This is not a Play Store production release. The APK is signed with a temporary debug keystore.
          
          Download the \`${ASSET_NAME}\` file below to install and test on your Android device.
          EOF
          )
          
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Summary ==="
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "GitHub Release published successfully."
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Release Asset: $ASSET_NAME"
            
            gh release view "$RELEASE_TAG" || true
            
            echo "### 🚀 Debug APK Build & Release Successful" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page**: [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download**: Available in the **Assets** section of the [Release Page]($RELEASE_URL) as \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact**: \`app-debug-apk\` is also preserved in this workflow run as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete successfully or was skipped."
            echo "APK Build and Actions artifact upload succeeded."
            echo "The debug APK artifact 'app-debug-apk' is available for download directly from the Actions run artifacts."
            
            echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Build**: Succeeded ✓" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact**: The debug APK is preserved as artifact **\`app-debug-apk\`** on this workflow run." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Note**: GitHub Release publishing was not completed, but your APK is fully built and downloadable from the Artifacts section above." >> "$GITHUB_STEP_SUMMARY"
          fi
